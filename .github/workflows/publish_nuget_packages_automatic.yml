name: Push Nuget to Azure Artifacts

on:
  workflow_call:
    inputs:
      DOTNET_VERSION:
        type: string
      PROJECT_DIR:
        type: string
      PROJECT_NAME:
        type: string
    secrets:
      NUGET_URL:
        required: true
      NUGET_TOKEN:
        required: true
jobs:
  vulnerability_scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # Required to checkout and read repo files
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          # exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'  	

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ inputs.DOTNET_VERSION }}
          source-url: ${{ secrets.NUGET_URL }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_TOKEN }}

      - name: Restore
        run: |
          dotnet restore ${{ inputs.PROJECT_DIR }}/${{ inputs.PROJECT_NAME }}.csproj

      - name: Build
        run: |
          dotnet build --no-restore ${{ inputs.PROJECT_DIR }}/${{ inputs.PROJECT_NAME }}.csproj -c Release

      - name: Pack
        run: |
          dotnet pack ${{ inputs.PROJECT_DIR }}/${{ inputs.PROJECT_NAME }}.csproj --no-restore -c Release

      - name: Publish
        run: |
          dotnet nuget push --api-key AzureArtifacts ${{ inputs.PROJECT_DIR }}/bin/Release/*.nupkg
