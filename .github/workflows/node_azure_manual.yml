name: Deploy a Javascript application to the Azure cloud.

on:
  workflow_call:
    inputs:
      CLIENT_ENV:
        type: string
      AZURE_WEBAPP_NAME:
        type: string
      AZURE_WEBAPP_PACKAGE_PATH:
        type: string
      SLOT_NAME:
        type: string
      REPO_NAME:
        type: string
      BUILD_FOLDER:
        type: string
    secrets:
      AZURE_WEBAPP_PUBLISH_PROFILE:
        required: true
      AZURE_CREDENTIALS:
        required: true

jobs:
  vulnerability_scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # Required to checkout and read repo files
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          # exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'  	

  Build-and-Deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 14.x.x
        #cache: 'npm'
        
    - name: Install the latest npm version
      run: npm install -g npm@latest
      
    - name: Install dependencies
      run: npm install
      
    - name: Run unit tests
      run: npm test

    - name: Build the application
      run:  npm run build-${{inputs.CLIENT_ENV}}
      env:
        CI: ""

    - name: Azure Login
      uses: Azure/login@v1.4.3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
         app-name: ${{ inputs.AZURE_WEBAPP_NAME }}
         publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
         package: ${{inputs.BUILD_FOLDER}}
         slot-name: ${{ inputs.SLOT_NAME }}
